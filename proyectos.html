<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Proyectos de branding, packaging y diseño web de RÊVE Studio" />
    <title>Proyectos — RÊVE Studio</title>
    <link rel="icon" href="assets/FavIcon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,100,200..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="projects-page">
    <header class="site-header">
      <nav class="navbar" aria-label="Navegación principal" data-nav>
        <a class="brand" href="index.html" aria-label="RÊVE Studio, ir al inicio">
          <img src="assets/LOGO-Bordo.svg" alt="" aria-hidden="true" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="site-menu">
          <span></span>
          <span></span>
        </button>
        <ul class="nav-menu" id="site-menu">
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="proyectos.html">Proyectos</a></li>
          <li><a href="index.html#servicios">Servicios</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="projects-main">
      <div class="project-filters" role="group" aria-label="Filtrar proyectos">
        <button class="project-filter is-active" type="button" data-filter="all" aria-pressed="true">Todos</button>
        <button class="project-filter" type="button" data-filter="branding" aria-pressed="false">Branding</button>
        <button class="project-filter" type="button" data-filter="packaging" aria-pressed="false">Packaging</button>
        <button class="project-filter" type="button" data-filter="web" aria-pressed="false">Diseño web</button>
        <button class="project-filter" type="button" data-filter="otros" aria-pressed="false">Otros</button>
      </div>

      <section class="projects-grid" aria-live="polite" aria-label="Listado de proyectos"></section>
    </main>

    <section class="contact" id="contacto" aria-labelledby="contact-title">
      <div class="contact__brand">
        <img src="assets/LOGO-naranja.svg" alt="Guada Studio" />
      </div>
      <div class="contact__cta">
        <h2 id="contact-title" data-contact-title>Don't be shy, give RÊVE a try!</h2>
        <a class="button button--primary contact-gooey-button" href="mailto:hola.revestudio@gmail.com">
          <span class="contact-gooey-button__blobs" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="contact-gooey-button__label">Escribinos</span>
        </a>
      </div>
    </section>

    <footer class="footer">
      <p><span data-footer-credit>Por Guadalupe Petriz</span> | <span id="current-year"></span></p>
      <ul aria-label="Redes sociales">
        <li>
          <a
            href="https://www.instagram.com/by_revestudio/"
            aria-label="Instagram de REVE Studio"
            target="_blank"
            rel="noopener noreferrer"
          >
            Instagram
          </a>
        </li>
      </ul>
    </footer>
    <script src="projects-data.js"></script>
    <script src="projects-shared.js"></script>
    <script src="projects.js"></script>
  </body>
</html>

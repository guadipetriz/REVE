<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Proyectos de branding, packaging y diseño web de RÊVE Studio" />
    <title>Proyectos — RÊVE Studio</title>
    <link rel="icon" href="assets/FavIcon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,100,200..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="projects-page">
    <header class="site-header">
      <nav class="navbar" aria-label="Navegación principal" data-nav>
        <a class="brand" href="index.html" aria-label="RÊVE Studio, ir al inicio">
          <img src="assets/LOGO-Bordo.svg" alt="" aria-hidden="true" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="site-menu">
          <span></span>
          <span></span>
        </button>
        <ul class="nav-menu" id="site-menu">
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="proyectos.html">Proyectos</a></li>
          <li><a href="index.html#servicios">Servicios</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="projects-main">
      <div class="project-filters" role="group" aria-label="Filtrar proyectos">
        <button class="project-filter is-active" type="button" data-filter="all" aria-pressed="true">Todos</button>
        <button class="project-filter" type="button" data-filter="branding" aria-pressed="false">Branding</button>
        <button class="project-filter" type="button" data-filter="packaging" aria-pressed="false">Packaging</button>
        <button class="project-filter" type="button" data-filter="web" aria-pressed="false">Diseño web</button>
        <button class="project-filter" type="button" data-filter="otros" aria-pressed="false">Otros</button>
      </div>

      <section class="projects-grid" aria-live="polite" aria-label="Listado de proyectos">
        <article class="grid-project" data-category="branding packaging" tabindex="0">
          <div class="grid-project__image"><img src="assets/services/branding/branding-07.jpg" alt="Identidad visual de Olen Aroa" /></div>
          <div class="grid-project__content"><p>Branding / Packaging</p><h2>Olen Aroa</h2></div>
        </article>
        <article class="grid-project" data-category="branding" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/dos-orillas.jpg" alt="Identidad visual de Dos Orillas" /></div>
          <div class="grid-project__content"><p>Branding</p><h2>Dos Orillas</h2></div>
        </article>
        <article class="grid-project" data-category="branding" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/valentina.jpg" alt="Identidad visual y ecommerce de Valentina" /></div>
          <div class="grid-project__content"><p>Branding</p><h2>Valentina</h2></div>
        </article>
        <article class="grid-project" data-category="packaging" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/dulces-serra.jpg" alt="Diseño de packaging para Dulces Serra" /></div>
          <div class="grid-project__content"><p>Packaging</p><h2>Dulces Serra</h2></div>
        </article>
        <article class="grid-project" data-category="web" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/wabro.jpg" alt="Diseño de tienda online para Wabro" /></div>
          <div class="grid-project__content"><p>Diseño web</p><h2>Wabro</h2></div>
        </article>
        <article class="grid-project" data-category="otros" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/checkpoint-charlie.jpg" alt="Diseño gráfico y arquigrafía para Checkpoint Charlie" /></div>
          <div class="grid-project__content"><p>Arquigrafía</p><h2>Checkpoint Charlie</h2></div>
        </article>
        <article class="grid-project" data-category="otros" tabindex="0">
          <div class="grid-project__image"><img src="assets/portfolio-jpg/muvon.jpg" alt="Contenido para paid media de Muvon" /></div>
          <div class="grid-project__content"><p>Diseño gráfico</p><h2>Muvon</h2></div>
        </article>
      </section>
    </main>

    <footer class="footer">
      <p>Por Guadalupe Petriz | <span id="current-year"></span></p>
      <a href="https://www.instagram.com/by_revestudio/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </footer>
    <script src="projects.js"></script>
  </body>
</html>
